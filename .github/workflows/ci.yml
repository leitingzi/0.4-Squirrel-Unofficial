name: Build Squirrel Plugin

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        arch: [x86, x64]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup build tools (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential g++-multilib libc6-dev-i386 make python3

      - name: Show environment
        run: |
          echo "Runner OS: $RUNNER_OS"
          echo "Matrix OS: ${{ matrix.os }}"
          echo "Arch: ${{ matrix.arch }}"

      - name: Build squirrel libs (squirrelsrc) on Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          if [ "${{ matrix.arch }}" = "x86" ]; then
            make -C squirrelsrc sq32
            cp squirrelsrc/lib/libsquirrel.a squirrelsrc/lib/libsquirrel32.a || true
            cp squirrelsrc/lib/libsqstdlib.a squirrelsrc/lib/libsqstdlib32.a || true
          else
            make -C squirrelsrc sq64
            cp squirrelsrc/lib/libsquirrel.a squirrelsrc/lib/libsquirrel64.a || true
            cp squirrelsrc/lib/libsqstdlib.a squirrelsrc/lib/libsqstdlib64.a || true
          fi

      - name: Build project on Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          if [ "${{ matrix.arch }}" = "x86" ]; then
            make build32 || true
          else
            make build64 || true
          fi

      - name: Build project on Windows (MSBuild)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            Write-Error "vswhere not found at $vswhere"
            exit 1
          }
          # Robustly parse vswhere output into lines and pick the first non-empty line
          $rawVswhere = (& $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath) | Out-String
          $lines = $rawVswhere -split "\r?\n"
          $installPath = ($lines | ForEach-Object { $_.Trim() } | Where-Object { $_ -ne '' } | Select-Object -First 1)
          if (-not $installPath) {
            Write-Error "No Visual Studio installation with MSBuild found by vswhere"
            exit 1
          }
          # Build MSBuild candidate paths without Join-Path to avoid parameter type issues
          $msbuildPaths = @(
            "$installPath\MSBuild\Current\Bin\MSBuild.exe",
            "$installPath\MSBuild\15.0\Bin\MSBuild.exe",
            "$installPath\MSBuild\14.0\Bin\MSBuild.exe"
          )
          $msbuild = $msbuildPaths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $msbuild) {
            Write-Error "MSBuild.exe not found under $installPath"
            exit 1
          }
          Write-Host "Using MSBuild: $msbuild"
          if ("${{ matrix.arch }}" -eq "x86") {
            & $msbuild Squirrel04.sln /p:Configuration=Release /p:Platform=Win32
          } else {
            & $msbuild Squirrel04.sln /p:Configuration=Release /p:Platform=x64
          }

      - name: Collect artifacts into generate/ (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -e
          OUTDIR="generate/${{ matrix.os }}-${{ matrix.arch }}"
          mkdir -p "$OUTDIR"
          # Find all .so files excluding obj and git and generate dirs, copy only the basenames
          find . -type f -name '*.so' \
            -not -path './obj/*' -not -path '*/obj/*' -not -path './.git/*' -not -path './generate/*' \
            -print0 | while IFS= read -r -d '' f; do
            cp --parents "$f" "$OUTDIR/" || cp "$f" "$OUTDIR/" || true
          done
          echo "Final generate/ contents:"
          ls -la generate || true

      - name: Collect artifacts into generate/ (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = "generate\${{ matrix.os }}-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          # Find all dll files excluding obj, .git and generate directories
          Get-ChildItem -Path . -Recurse -File -Filter *.dll | Where-Object {
            $_.FullName -notmatch '\\obj\\' -and $_.FullName -notmatch '\.git\\' -and $_.FullName -notmatch '\\generate\\'
          } | ForEach-Object {
            $dest = Join-Path $out $_.Name
            Copy-Item -Path $_.FullName -Destination $dest -Force
          }
          Write-Host "Final generate/ contents:"
          Get-ChildItem -Path generate -Recurse | Format-Table -AutoSize

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: squirrel-build-${{ matrix.os }}-${{ matrix.arch }}
          path: generate/

  collect-artifacts:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded

      - name: Show downloaded artifacts
        run: |
          echo "Downloaded artifact folders:"
          ls -la downloaded || true

      - name: Repackage all artifacts into single archive
        run: |
          set -e
          mkdir -p combined
          # Move each artifact folder into combined/, preserving names (linux-x86 etc.)
          if [ -d downloaded ]; then
            mv downloaded/* combined/ || true
          fi
          ARCHIVE_NAME="squirrel-all-artifacts-${{ github.run_number }}.tar.gz"
          tar -czf "$ARCHIVE_NAME" -C combined .
          echo "Created $ARCHIVE_NAME"

      - name: Upload combined artifact
        uses: actions/upload-artifact@v4
        with:
          name: squirrel-all-artifacts
          path: squirrel-all-artifacts-${{ github.run_number }}.tar.gz
