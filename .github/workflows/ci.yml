name: Build Squirrel Plugin

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-x86:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential g++-multilib libc6-dev-i386 make python3

      - name: Build Linux x86
        run: |
          set -e
          make -C squirrelsrc sq32 || true
          make build32 || true

      - name: Collect libs
        run: |
          set -e
          OUTDIR="generate/ubuntu-latest-x86"
          mkdir -p "$OUTDIR"
          if [ -d build ]; then
            find build -type f -name '*.so' -print0 | while IFS= read -r -d '' f; do
              cp "$f" "$OUTDIR/" || true
            done
          fi
          echo "Files in $OUTDIR:"
          ls -la "$OUTDIR" || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: squirrel-build-ubuntu-latest-x86
          path: generate/ubuntu-latest-x86

  build-linux-x64:
    needs: build-linux-x86
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential make python3

      - name: Build Linux x64
        run: |
          set -e
          make -C squirrelsrc sq64 || true
          make build64 || true

      - name: Collect libs
        run: |
          set -e
          OUTDIR="generate/ubuntu-latest-x64"
          mkdir -p "$OUTDIR"
          if [ -d build ]; then
            find build -type f -name '*.so' -print0 | while IFS= read -r -d '' f; do
              cp "$f" "$OUTDIR/" || true
            done
          fi
          echo "Files in $OUTDIR:"
          ls -la "$OUTDIR" || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: squirrel-build-ubuntu-latest-x64
          path: generate/ubuntu-latest-x64

  build-windows-x86:
    needs: build-linux-x64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Build Windows x86 (MSBuild)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            Write-Error "vswhere not found at $vswhere"
            exit 1
          }
          $raw = (& $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath) | Out-String
          $lines = $raw -split "\r?\n"
          $installPath = ($lines | ForEach-Object { $_.Trim() } | Where-Object { $_ -ne '' } | Select-Object -First 1)
          if (-not $installPath) { Write-Error "No VS found"; exit 1 }
          $msbuildPaths = @(
            "$installPath\MSBuild\Current\Bin\MSBuild.exe",
            "$installPath\MSBuild\15.0\Bin\MSBuild.exe"
          )
          $ms = $msbuildPaths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $ms) { Write-Error "MSBuild.exe not found"; exit 1 }
          & $ms Squirrel04.sln /p:Configuration=Release /p:Platform=Win32

      - name: Collect libs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = "generate/windows-latest-x86"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          if (Test-Path -Path "build") {
            Get-ChildItem -Path build -Recurse -Include *.dll,*.so -File | ForEach-Object {
              Copy-Item -Path $_.FullName -Destination $out -Force
            }
          }
          Write-Host "Files in $out:"
          Get-ChildItem -Path $out | Format-Table -AutoSize

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: squirrel-build-windows-latest-x86
          path: generate/windows-latest-x86

  build-windows-x64:
    needs: build-windows-x86
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Build Windows x64 (MSBuild)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { Write-Error "vswhere not found"; exit 1 }
          $raw = (& $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath) | Out-String
          $lines = $raw -split "\r?\n"
          $installPath = ($lines | ForEach-Object { $_.Trim() } | Where-Object { $_ -ne '' } | Select-Object -First 1)
          if (-not $installPath) { Write-Error "No VS found"; exit 1 }
          $msbuildPaths = @(
            "$installPath\MSBuild\Current\Bin\MSBuild.exe",
            "$installPath\MSBuild\15.0\Bin\MSBuild.exe"
          )
          $ms = $msbuildPaths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $ms) { Write-Error "MSBuild.exe not found"; exit 1 }
          & $ms Squirrel04.sln /p:Configuration=Release /p:Platform=x64

      - name: Collect libs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = "generate/windows-latest-x64"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          if (Test-Path -Path "build") {
            Get-ChildItem -Path build -Recurse -Include *.dll,*.so -File | ForEach-Object {
              Copy-Item -Path $_.FullName -Destination $out -Force
            }
          }
          Write-Host "Files in $out:"
          Get-ChildItem -Path $out | Format-Table -AutoSize

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: squirrel-build-windows-latest-x64
          path: generate/windows-latest-x64
