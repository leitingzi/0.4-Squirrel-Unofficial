name: Build Squirrel Plugin

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        arch: [x86, x64]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup build tools (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential g++-multilib libc6-dev-i386 make python3

      - name: Show environment
        run: |
          echo "Runner OS: $RUNNER_OS"
          echo "Matrix OS: ${{ matrix.os }}"
          echo "Arch: ${{ matrix.arch }}"

      - name: Build squirrel libs (squirrelsrc) on Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          if [ "${{ matrix.arch }}" = "x86" ]; then
            make -C squirrelsrc sq32
            cp squirrelsrc/lib/libsquirrel.a squirrelsrc/lib/libsquirrel32.a || true
            cp squirrelsrc/lib/libsqstdlib.a squirrelsrc/lib/libsqstdlib32.a || true
          else
            make -C squirrelsrc sq64
            cp squirrelsrc/lib/libsquirrel.a squirrelsrc/lib/libsquirrel64.a || true
            cp squirrelsrc/lib/libsqstdlib.a squirrelsrc/lib/libsqstdlib64.a || true
          fi

      - name: Build project on Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          if [ "${{ matrix.arch }}" = "x86" ]; then
            make build32 || true
          else
            make build64 || true
          fi

      - name: Build project on Windows (MSBuild)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            Write-Error "vswhere not found at $vswhere"
            exit 1
          }
          $installPath = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          $installPath = $installPath | Where-Object { $_ -and $_ -ne '' } | Select-Object -First 1
          if (-not $installPath) {
            Write-Error "No Visual Studio installation with MSBuild found by vswhere"
            exit 1
          }
          $installPath = $installPath.Trim()
          $msbuildPaths = @(
            Join-Path $installPath "MSBuild\Current\Bin\MSBuild.exe"
            Join-Path $installPath "MSBuild\15.0\Bin\MSBuild.exe"
            Join-Path $installPath "MSBuild\14.0\Bin\MSBuild.exe"
          )
          $msbuild = $msbuildPaths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $msbuild) {
            Write-Error "MSBuild.exe not found under $installPath"
            exit 1
          }
          Write-Host "Using MSBuild: $msbuild"
          # Override Windows SDK version to one available on hosted runner
          $winSdk = '10.0.22621.0'
          if ("${{ matrix.arch }}" -eq "x86") {
            & $msbuild Squirrel04.sln /p:Configuration=Release /p:Platform=Win32 /p:WindowsTargetPlatformVersion=$winSdk /p:PlatformToolset=v143
          } else {
            & $msbuild Squirrel04.sln /p:Configuration=Release /p:Platform=x64 /p:WindowsTargetPlatformVersion=$winSdk /p:PlatformToolset=v143
          }

      - name: Collect artifacts into generate/
        run: |
          set -e
          mkdir -p generate
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            # copy shared objects from objdir
            if find objdir -type f -name '*.so' | grep -q .; then
              find objdir -type f -name '*.so' -exec cp --parents {} generate/ \;
            fi
            if [ -d build ]; then
              cp -r build/* generate/ || true
            fi
          else
            # On Windows runner use PowerShell to find DLL/EXE
            pwsh -Command "Get-ChildItem -Path . -Recurse -Filter '*.dll','*.exe' | ForEach-Object { $dest='generate\'+($_.FullName.Substring((Get-Location).Path.Length).TrimStart('\\')); New-Item -ItemType Directory -Force -Path (Split-Path $dest) | Out-Null; Copy-Item $_.FullName $dest }
          fi
          echo "Final generate/ contents:"
          ls -la generate || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: squirrel-build-${{ matrix.os }}-${{ matrix.arch }}
          path: generate/
