name: Build Squirrel Plugin

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        arch: [x86, x64]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup build tools (Linux)
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential g++-multilib libc6-dev-i386 make python3

      - name: Show environment
        run: |
          echo "Runner OS: $RUNNER_OS"
          echo "Matrix OS: ${{ matrix.os }}"
          echo "Arch: ${{ matrix.arch }}"

      - name: Build squirrel libs (squirrelsrc) on Linux
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          if [ "${{ matrix.arch }}" = "x86" ]; then
            make -C squirrelsrc sq32
            cp squirrelsrc/lib/libsquirrel.a squirrelsrc/lib/libsquirrel32.a || true
            cp squirrelsrc/lib/libsqstdlib.a squirrelsrc/lib/libsqstdlib32.a || true
          else
            make -C squirrelsrc sq64
            cp squirrelsrc/lib/libsquirrel.a squirrelsrc/lib/libsquirrel64.a || true
            cp squirrelsrc/lib/libsqstdlib.a squirrelsrc/lib/libsqstdlib64.a || true
          fi

      - name: Build project on Linux
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          if [ "${{ matrix.arch }}" = "x86" ]; then
            make build32 || true
          else
            make build64 || true
          fi

      - name: Debug: list build folder (Linux)
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          echo "PWD: $(pwd)"
          echo "--- repo root ---"
          ls -la || true
          echo "--- build dir ---"
          if [ -d build ]; then
            ls -la build || true
            find build -type f -maxdepth 4 -print || true
          else
            echo "no build dir"
          fi
          echo "--- squirrelsrc/lib ---"
          ls -la squirrelsrc/lib || true
          echo "--- find so/a files ---"
          find . -type f \( -iname "*.so" -o -iname "*.a" -o -iname "*.so.*" \) -print || true

      - name: Build project on Windows (MSBuild)
        if: ${{ matrix.os == 'windows-latest' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            Write-Error "vswhere not found at $vswhere"
            exit 1
          }
          # Robustly parse vswhere output into lines and pick the first non-empty line
          $rawVswhere = (& $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath) | Out-String
          $lines = $rawVswhere -split "\r?\n"
          $installPath = ($lines | ForEach-Object { $_.Trim() } | Where-Object { $_ -ne '' } | Select-Object -First 1)
          if (-not $installPath) {
            Write-Error "No Visual Studio installation with MSBuild found by vswhere"
            exit 1
          }
          # Build MSBuild candidate paths without Join-Path to avoid parameter type issues
          $msbuildPaths = @(
            "$installPath\MSBuild\Current\Bin\MSBuild.exe",
            "$installPath\MSBuild\15.0\Bin\MSBuild.exe",
            "$installPath\MSBuild\14.0\Bin\MSBuild.exe"
          )
          $msbuild = $msbuildPaths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $msbuild) {
            Write-Error "MSBuild.exe not found under $installPath"
            exit 1
          }
          Write-Host "Using MSBuild: $msbuild"
          if ("${{ matrix.arch }}" -eq "x86") {
            & $msbuild Squirrel04.sln /p:Configuration=Release /p:Platform=Win32
          } else {
            & $msbuild Squirrel04.sln /p:Configuration=Release /p:Platform=x64
          }

      - name: Debug: list build folder (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host "Location: $(Get-Location)"
          Write-Host '--- repo root (top 200 files) ---'
          Get-ChildItem -Path . -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 200 | ForEach-Object { Write-Host $_.FullName }
          Write-Host '--- build folder ---'
          if (Test-Path -Path 'build') { Get-ChildItem -Path .\build -Recurse -File -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName } } else { Write-Host 'no build folder' }
          Write-Host '--- squirrelsrc\lib ---'
          if (Test-Path -Path 'squirrelsrc\lib') { Get-ChildItem -Path .\squirrelsrc\lib -Recurse -File -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName } } else { Write-Host 'no squirrelsrc/lib' }
          Write-Host '--- find dll/exe ---'
          Get-ChildItem -Path . -Recurse -File -Include *.dll,*.exe -ErrorAction SilentlyContinue | Select-Object -First 200 | ForEach-Object { Write-Host $_.FullName }

      - name: Collect artifacts into generate/ (Linux)
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          set -e
          OUTDIR="generate/${{ matrix.os }}-${{ matrix.arch }}"
          mkdir -p "$OUTDIR"
          # copy entire build dir if present
          if [ -d build ]; then
            cp -r build "$OUTDIR/" || true
          fi
          echo "Final generate/ contents:"
          ls -la generate || true

      - name: Collect artifacts into generate/ (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = "generate\${{ matrix.os }}-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          if (Test-Path -Path "build") {
            Copy-Item -Path "build" -Destination $out -Recurse -Force
          }
          Write-Host "Final generate/ contents:"
          Get-ChildItem -Path generate -Recurse | Format-Table -AutoSize

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: squirrel-build-${{ matrix.os }}-${{ matrix.arch }}
          path: generate/
