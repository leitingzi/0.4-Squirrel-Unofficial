name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential g++-multilib libc6-dev-i386 make python3

      - name: Show Makefile
        run: cat Makefile

      - name: Build project (Makefile)
        run: make build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: squirrel-build
          path: build/
